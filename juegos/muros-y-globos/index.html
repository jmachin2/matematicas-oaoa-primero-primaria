.specialFlag{position:absolute;top:3px;left:102px;font-size:22px;filter:drop-shadow(0 2px 3px #0005);z-index:2}.falling.gold .payload{border-color:#e6a316}.falling.rainbow .payload{border-color:#b595f3}
.wall{overflow:hidden}.castleTower{background:linear-gradient(135deg,#f7f2e1,#e9e5d7);border:2px solid #d8d0bb;border-radius:5px;padding:5px;min-height:31px;display:flex;flex-direction:column-reverse;gap:3px;margin:2px 0 7px;position:relative}.castleCourse{height:25px;border-radius:4px;background:#fffdfa99;border:1px dashed #c7baa5;display:flex;align-items:center;padding:2px;gap:2px;justify-content:center}.castleCourse.done{border:1px solid #ab9b75;background:linear-gradient(#fff9e9,#eee6c8);box-shadow:0 1px 2px #9e896455}.castleCourse i{height:17px;border:1px solid #0003;border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:900;font-style:normal;color:#233047;box-shadow:inset 0 2px 0 #fff6}.castleDoor{height:20px;width:23px;margin:0 auto;background:#926b4b;border-radius:12px 12px 0 0;border:2px solid #70523d;position:relative}.castleDoor:after{content:'•';position:absolute;right:2px;color:#f3d88b;font-size:11px}.wall.complete{border-color:#e8c652;background:#fffbed}.wall.complete h2:after{content:'🏁';font-size:16px}
#castleBanner{font-size:12px;color:#477083;text-align:center;font-weight:850;margin-bottom:4px}.starsResult{font-size:47px;letter-spacing:4px;margin:9px 0}.burst{animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}

@media(max-height:650px){#wallswrap{min-height:122px;max-height:32dvh}.wall{padding:5px}.slots{gap:2px}.slot{min-height:20px}.balloon{transform:scale(.77);height:62px;transform-origin:bottom center}.falling .payload{margin-top:12px}}

/* V8: siempre una única fila de muros, del 2 al 10 en el último nivel. */
#wallswrap{overflow-x:auto;overflow-y:auto;min-height:132px;scrollbar-gutter:stable}
#walls{display:grid;grid-template-columns:repeat(var(--wall-count,1),minmax(0,1fr));gap:clamp(3px,.45vw,8px);justify-content:stretch;align-items:stretch;min-width:0}
#walls .wall{min-width:0;min-height:0;flex:none;padding:6px 5px;border-radius:9px;overflow:hidden}

#walls .wall .sub{font-size:clamp(9px,.85vw,12px);margin-left:2px}
#walls .castleTower{padding:3px;gap:2px;margin:2px 0 5px;min-width:0}
#walls .castleCourse{height:clamp(18px,2vw,23px);padding:1px;gap:1px;min-width:0}
#walls .castleCourse i{height:clamp(12px,1.45vw,17px);font-size:clamp(8px,.85vw,10px);min-width:0}
#walls .castleDoor{height:13px;width:17px}
#walls[data-count="7"] .wall h2,#walls[data-count="8"] .wall h2,#walls[data-count="9"] .wall h2{font-size:clamp(10px,1vw,13px)}
#walls[data-count="7"] .wall,#walls[data-count="8"] .wall,#walls[data-count="9"] .wall{padding:4px 3px}
@media(max-width:690px){
  /* En pantallas muy estrechas, conservar UNA fila desplazable en vez de partirla. */
  #walls{grid-template-columns:repeat(var(--wall-count,1),minmax(93px,1fr));min-width:max-content}
  #walls .wall h2{font-size:11px}
  #wallswrap{overflow-x:auto;overscroll-behavior-x:contain}
}

<body>
<div id="game">
<header>
<h1>🎈 <span>OAOA</span> · Muros de regletas</h1>
<span id="levelPill" class="pill">Nivel 1</span><span id="goalPill" class="pill">🧱 Muros: 2</span><span id="countPill" class="pill">⭐ 0/1</span><span id="lifePill" class="pill">💚 Sin caídas</span><span id="scorePill" class="pill">🏆 0 puntos</span><span id="streakPill" class="pill">🔥 Racha 0</span>
<div class="controls"><a href="../" class="btn" style="text-decoration:none;display:inline-flex;align-items:center" aria-label="Volver a Juegos OAOA">← Juegos OAOA</a><button id="mute" class="btn" aria-label="Activar o desactivar música">🔊</button><button id="pause" class="btn">⏸ Pausa</button><button id="restart" class="btn">↻ Reiniciar</button></div>
</header>
<div id="instruction">👆 Atrapa el globo antes de que llegue al suelo y lleva sus <b>dos regletas</b> al muro correcto.</div>
<div id="progress"><div id="progressFill"></div></div>
<div id="arena"><div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div><div id="items"></div><div id="buddy" aria-live="polite"><div id="buddyFace">🤖</div><div id="buddySay">¡Vamos a construir!</div></div><div id="ground"></div><div id="toast" class="hidden"></div></div>
<div id="wallswrap"><div id="castleBanner">🏰 CONSTRUYE EL CASTILLO: cada pareja correcta levanta una hilera</div><div id="walls"></div></div>
<div id="overlay" class="screen"><div id="panel" class="panel"></div></div>
</div>
<script>
'use strict';
// Regletas Cuisenaire usadas en OAOA: 1 blanca, 2 roja, 3 verde claro, 4 rosa, etc.
const C={1:['Blanca','#f6f5ef'],2:['Roja','#e9434d'],3:['Verde claro','#82c979'],4:['Rosa','#f3a0c3'],5:['Amarilla','#ffd446'],6:['Verde oscuro','#289869'],7:['Negra','#3c414c'],8:['Marrón','#a46e44'],9:['Azul','#3679d2'],10:['Naranja','#f18a37']};
const $=s=>document.querySelector(s);let level=1,maxLevel=9,streams=1,speed=1,musicOn=true,playing=false,paused=false,gameOver=false,completed=new Set(),jobs=[],active=[],nextId=0,dragging=null,lastFrame=0,spawnClock=0,toastTimer=0,frameId=0,penaltyId=null,score=0,streak=0,bestStreak=0,mistakes=0,bonusEarned=0,buddyTimer=null,levelToken=0;let audioCtx=null,musicTimer=null,musicStep=0;
const el={arena:$('#arena'),items:$('#items'),walls:$('#walls'),overlay:$('#overlay'),panel:$('#panel'),toast:$('#toast')};
function pkey(n,a){return `${n}:${a}`};function pairList(n){return Array.from({length:Math.floor(n/2)},(_,i)=>[i+1,n-(i+1)])}
function rect(){return el.arena.getBoundingClientRect()};function rod(num,cl='rod'){return `<span class="${cl}${num===1?' white':''}" style="width:${12+num*3}px;background:${C[num][1]};color:${[1,4,5].includes(num)?'#294055':'#fff'}">${num}</span>`}
// Banda sonora original chiptune de 8 bits, sintetizada localmente (sin archivos ni red).
function note(freq,dur=.12,kind='square',vol=.026,at=null){
 if(!musicOn||!audioCtx||!freq)return;
 try{
  const t=at??audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=kind;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.009);
  g.gain.setValueAtTime(Math.max(.0002,vol*.72),t+Math.max(.02,dur*.5));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.018);
 }catch(e){}
}
function drum(type,at){
 if(!musicOn||!audioCtx)return;
 try{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  if(type==='kick'){
   o.type='sine';o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(48,at+.11);
   g.gain.setValueAtTime(.075,at);g.gain.exponentialRampToValueAtTime(.0001,at+.135);
  }else{
   o.type='triangle';o.frequency.setValueAtTime(1150,at);o.frequency.exponentialRampToValueAtTime(210,at+.055);
   g.gain.setValueAtTime(.023,at);g.gain.exponentialRampToValueAtTime(.0001,at+.07);
  }
  o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+(type==='kick'?.145:.08));
 }catch(e){}
}
const arcadeLead=[659,784,988,784,659,0,587,659,784,988,1047,988,784,0,659,587,
 523,659,784,659,523,0,494,523,587,784,880,784,659,587,523,0];
const arcadeBass=[165,165,196,165,147,147,196,147,131,131,175,131,147,147,196,147];
const arcadeArp=[330,392,494,392,294,392,494,392,262,330,440,330,294,392,494,392];
function arcadeBeat(){
 if(!musicOn||!playing||paused||!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+.012,i=musicStep%32;
 note(arcadeLead[i],.115,'square',.018,t);
 if(i%2===0)note(arcadeBass[Math.floor(musicStep/2)%16],.21,'triangle',.037,t);
 note(arcadeArp[musicStep%16],.065,'square',.006,t+.018);
 if(i%4===0)drum('kick',t);
 if(i%4===2)drum('hat',t);
 musicStep++;
}
function audioStart(){
 if(!musicOn)return;
 try{
  audioCtx??=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicTimer)return;
  musicTimer=setInterval(arcadeBeat,155);
 }catch(e){musicOn=false;$('#mute').textContent='🔇'}
}
function chime(ok){
 if(!audioCtx||!musicOn)return;
 [0,1,2].forEach((_,i)=>setTimeout(()=>note((ok?[784,988,1175]:[390,310,240])[i],.12,ok?'square':'sawtooth',.027),i*95));
}
function saveSettings(){try{localStorage.setItem('oaoa-game-settings',JSON.stringify({streams,speed,musicOn}))}catch(e){}}
try{let x=JSON.parse(localStorage.getItem('oaoa-game-settings')||'{}');streams=Math.max(1,Math.min(3,Number(x.streams)||1));speed=Math.max(.65,Math.min(1.75,Number(x.speed)||1));if(x.musicOn===false)musicOn=false}catch(e){}
function intro(){playing=false;paused=false;$('#pause').textContent='⏸ Pausa';el.overlay.classList.remove('hidden');el.panel.innerHTML=`<div class="big">🎈🧱🌈</div><h2>¡Construye los muros!</h2><p>En el <b>nivel 1</b> completas el muro del <b>2</b>. Hay 9 niveles: del muro del 2 al muro del 10. En cada nivel aparece uno nuevo, ¡y tienes que completar también los anteriores!</p><div class="setup"><label>🎈 Globos a la vez<select id="setStreams"><option value="1">1 · Fácil</option><option value="2">2 · Medio</option><option value="3">3 · Difícil</option></select></label><label>💨 Velocidad de caída<select id="setSpeed"><option value="0.65">Lenta</option><option value="1">Normal</option><option value="1.35">Rápida</option><option value="1.75">Muy rápida</option></select></label></div><div class="info">✋ Pulsa y arrastra un globo mientras está en el aire. Suéltalo sobre el muro cuyo número sea la <b>suma</b> de las dos regletas. <b>1 + 3</b> va al muro <b>4</b>. Al coger un globo, aparece inmediatamente el siguiente (si quedan parejas pendientes). ⭐ Gana puntos con cada acierto, consigue rachas y atrapa globos dorados (bonus), arcoíris (doble puntuación) o de hielo (más lentos). Cada regleta colocada construye una hilera del castillo. 🤖 El robot te acompaña. Si colocas una pareja en el muro equivocado, aparecerá una única pareja adicional; no aparecerán más hasta resolverla. Si una pareja llega al suelo, debes volver a intentar el nivel.<br>🎵 Música arcade original de 8 bits. Empieza después de pulsar Jugar; puedes silenciarla con 🔊.</div><button class="action" id="start">▶ ¡Jugar!</button>`;$('#setStreams').value=streams;$('#setSpeed').value=String(speed);$('#start').onclick=()=>{streams=+$('#setStreams').value;speed=+$('#setSpeed').value;saveSettings();audioStart();begin(1)}}
function begin(n){cancelAnimationFrame(frameId);levelToken++;level=n;score=0;streak=0;bestStreak=0;mistakes=0;bonusEarned=0;buddySpeak("¡Atrapa un globo y construye!", "🤖");completed.clear();active.forEach(j=>j.node.remove());active=[];jobs=[];dragging=null;penaltyId=null;spawnClock=0;lastFrame=0;playing=true;paused=false;gameOver=false;el.overlay.classList.add('hidden');$('#pause').textContent='⏸ Pausa';for(let w=2;w<=level+1;w++)for(let [a,b] of pairList(w))jobs.push({n:w,a,b,id:++nextId});shuffle(jobs);drawWalls();hud();frameId=requestAnimationFrame(tick)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function drawWalls(){el.walls.innerHTML='';el.walls.dataset.count=String(level);el.walls.style.setProperty('--wall-count',String(level));for(let n=2;n<=level+1;n++){
 const pairs=pairList(n),done=pairs.filter(p=>completed.has(pkey(n,p[0]))).length,wall=document.createElement('section');
 wall.className='wall'+(done===pairs.length?' complete':'');wall.dataset.wall=n;wall.style.setProperty('--castle',C[n][1]);
 const courses=pairs.map(([a,b])=>{let yes=completed.has(pkey(n,a));return `<div class="castleCourse ${yes?'done':''}" aria-label="${a} más ${b}${yes?' completado':' pendiente'}">${yes?`<i style="width:${a/n*100}%;background:${C[a][1]}">${a}</i><i style="width:${b/n*100}%;background:${C[b][1]}">${b}</i>`:'🧱'}</div>`}).join('');
 wall.innerHTML=`<h2><span class="swatch" style="background:${C[n][1]}"></span> Muro del ${n}<span class="sub">${done}/${pairs.length}</span></h2><div class="castleTower">${courses}</div><div class="castleDoor" aria-hidden="true"></div>`;
 el.walls.append(wall)
 }}
function totalPairs(){return Array.from({length:level},(_,i)=>Math.floor((i+2)/2)).reduce((a,b)=>a+b,0)}
function hud(){let total=totalPairs();$('#levelPill').textContent=`🎮 Nivel ${level} de ${maxLevel}`;$('#goalPill').textContent=`🏰 Muros 2–${level+1}`;$('#countPill').textContent=`🧱 ${completed.size}/${total}`;$('#progressFill').style.width=`${completed.size/total*100}%`;$('#lifePill').textContent='💚 Sin caídas';$('#scorePill').textContent=`🏆 ${score} puntos`;$('#streakPill').textContent=`🔥 Racha ${streak}`}
function buddySpeak(s,face='🤖'){clearTimeout(buddyTimer);$('#buddySay').textContent=s;$('#buddyFace').textContent=face;buddyTimer=setTimeout(()=>{$('#buddySay').textContent='¡Tú puedes!';$('#buddyFace').textContent='🤖'},3600)}
function specialKind(){const r=Math.random();return r<.09?'gold':r<.17?'rainbow':r<.25?'slow':'normal'}
function spawn(extraJob=null){if(!extraJob&&(!jobs.length||active.length>=streams))return;let job=extraJob||jobs.shift(),r=rect();let x=75+Math.random()*Math.max(1,r.width-150);if(r.width<240)x=r.width/2;let special= specialKind();let node=document.createElement('div');node.className='falling '+special;node.dataset.id=job.id;let colors=[['#ff7b81','#f8dc56'],['#56bdeb','#f89ac2'],['#9bd770','#ffd063'],['#a29bfa','#e9a7f7']][Math.floor(Math.random()*4)];node.style.setProperty('--bal1',colors[0]);node.style.setProperty('--bal2',colors[1]);node.innerHTML=`<div class="balloon"><div class="balloon-top"></div><div class="basket"></div></div>${special!=='normal'?`<span class="specialFlag">${special==='gold'?'⭐':special==='rainbow'?'🌈':'❄️'}</span>`:''}<div class="payload"><div class="rods">${rod(job.a)}${rod(job.b)}</div><div class="equation">${job.a} + ${job.b} = ?</div></div>`;el.items.append(node);let obj={...job,special,x,y:-85,node,held:false,dy:0,groundSince:null,graceUntil:0,v:((36+level*6)*speed+Math.random()*13)*(special==='slow'?.53:1)};active.push(obj);position(obj);node.addEventListener('pointerdown',onDown)}
function position(o){o.node.style.left=o.x+'px';o.node.style.top=o.y+'px'}
function onDown(e){if(!playing||paused||dragging)return;e.preventDefault();let o=active.find(o=>o.id===+e.currentTarget.dataset.id);if(!o)return;dragging=o;o.held=true;o.grabX=o.x;o.grabY=o.y;o.groundSince=null;o.node.classList.add('dragging');o.node.setPointerCapture(e.pointerId);o.ghost=o.node.cloneNode(true);o.ghost.removeAttribute('data-id');o.ghost.style.position='fixed';o.ghost.style.zIndex='999';o.ghost.style.pointerEvents='none';o.ghost.style.opacity='.94';document.body.append(o.ghost);o.node.style.opacity='.15';let r=rect();o.dx=o.x-(e.clientX-r.left);o.dy=o.y-(e.clientY-r.top);o.node.addEventListener('pointermove',onMove);o.node.addEventListener('pointerup',onUp);o.node.addEventListener('pointercancel',onUp);positionGhost(o);spawnOnGrab(o)}
// Relevo inmediato: al coger un globo aparece el siguiente, sin esperar a colocarlo.
// Máximo un globo de relevo por encima de la dificultad seleccionada;
// la penalización por error puede añadir uno más, pero nunca en cascada.
function spawnOnGrab(o){
  if(o.successorSpawned || !jobs.length)return;
  const normal=active.filter(j=>j.id!==penaltyId).length;
  if(normal>=streams+1)return;
  o.successorSpawned=true;
  spawn(jobs.shift());
}
function positionGhost(o){if(!o.ghost)return;let r=rect();o.ghost.style.left=(r.left+o.x)+'px';o.ghost.style.top=(r.top+o.y)+'px'}
function onMove(e){if(!dragging)return;let o=dragging,r=rect();o.x=Math.max(20,Math.min(r.width-20,e.clientX-r.left+o.dx));o.y=Math.max(-70,Math.min(r.height+80,e.clientY-r.top+o.dy));position(o);positionGhost(o);highlight(e.clientX,e.clientY)}
function highlight(x,y){document.querySelectorAll('.wall').forEach(w=>{let r=w.getBoundingClientRect();w.classList.toggle('highlight',x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)})}
function onUp(e){if(!dragging)return;let o=dragging;dragging=null;o.node.classList.remove('dragging');o.ghost?.remove();o.ghost=null;o.node.style.opacity='1';o.node.removeEventListener('pointermove',onMove);o.node.removeEventListener('pointerup',onUp);o.node.removeEventListener('pointercancel',onUp);let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.wall');highlight(-999,-999);if(!playing||paused)return;if(target){if(+target.dataset.wall===o.n){complete(o)}else{streak=0;mistakes++;hud();buddySpeak(`Busca el muro del ${o.n}. ¡Inténtalo otra vez!`,"🧐");restoreDropped(o);let added=addMistakePair(o);showToast(added?`🤔 Ese no es su muro. ¡Una pareja adicional!`:`🤔 Ese no es su muro. Coloca primero la pareja extra.`);chime(false)}}else{restoreDropped(o)}}
// Penalización controlada: como máximo UNA pareja extra sin resolver.
// No se encadenan penalizaciones por equivocarse varias veces sobre la misma pareja.
// La pareja extra se cuenta aparte de los globos elegidos en dificultad.
function addMistakePair(original){
  if(penaltyId!==null || active.length>=streams+2)return false;
  let job=jobs.length?jobs.shift():{n:original.n,a:original.a,b:original.b,id:++nextId};
  spawn(job);
  penaltyId=job.id;
  return true;
}
// Un gesto cancelado o soltado fuera de un muro no equivale a una caída.
// Devolvemos el globo a su posición anterior con un breve margen para reintentarlo.
function restoreDropped(o){o.x=o.grabX;o.y=o.grabY;o.held=false;o.groundSince=null;o.graceUntil=performance.now()+650;position(o)}
function complete(o){
 if(o.id===penaltyId)penaltyId=null;
 const fresh=!completed.has(pkey(o.n,o.a));
 if(fresh){completed.add(pkey(o.n,o.a));streak++;bestStreak=Math.max(bestStreak,streak);let earned=10+Math.min(30,Math.floor(streak/3)*5);
 if(o.special==='gold')earned+=40;
 if(o.special==='rainbow')earned*=2;
 score+=earned;bonusEarned+=earned-10;
 if(streak%3===0)buddySpeak(`¡${streak} seguidas! ¡Eres genial!`,'🥳');else if(o.special==='gold')buddySpeak('¡Globo dorado! ¡40 puntos extra!','⭐');else if(o.special==='rainbow')buddySpeak('¡Arcoíris! ¡Puntos dobles!','🌈');else buddySpeak(`¡Perfecto! ${o.a} y ${o.b} forman ${o.n}`,'🤖');
 showToast(`⭐ +${earned} puntos · ${o.a} + ${o.b} = ${o.n}`);
 }else{showToast('¡Bien! Has resuelto la pareja extra.');buddySpeak('¡Penalización resuelta!','🤖')}
 o.node.remove();active=active.filter(j=>j.id!==o.id);chime(true);drawWalls();hud();
 if(!jobs.length&&!active.length){playing=false;const token=levelToken;setTimeout(()=>{if(!gameOver&&token===levelToken)levelWon()},650)}
}
function showToast(s){clearTimeout(toastTimer);el.toast.textContent=s;el.toast.classList.remove('hidden');toastTimer=setTimeout(()=>el.toast.classList.add('hidden'),1400)}
function tick(t){if(!playing||paused)return;let dt=Math.min(.05,(t-(lastFrame||t))/1000);lastFrame=t;spawnClock+=dt;let threshold=streams===1?.32:.18;if(spawnClock>threshold){while(active.length<streams&&jobs.length)spawn();spawnClock=0}for(let o of active){if(o.held)continue;o.y+=o.v*dt;position(o);const payload=o.node.querySelector('.payload');const payloadBounds=payload.getBoundingClientRect();const groundBounds=$('#ground').getBoundingClientRect();const now=performance.now();const touchingGround=payloadBounds.top<groundBounds.top&&payloadBounds.bottom>=groundBounds.top;
// Solo hay pérdida si la parte inferior REAL de las regletas toca el suelo
// durante al menos 220 ms, sin arrastre ni tiempo de recuperación.
if(touchingGround&&now>=o.graceUntil){if(o.groundSince===null)o.groundSince=now;else if(now-o.groundSince>=220){fail(o);return}}else{o.groundSince=null}}frameId=requestAnimationFrame(tick)}
function fail(o){gameOver=true;playing=false;cancelAnimationFrame(frameId);chime(false);$('#lifePill').textContent='💔 ¡Cayó un globo!';el.overlay.classList.remove('hidden');el.panel.innerHTML=`<div class="big">💛🎈</div><h2>¡A intentarlo otra vez!</h2><p>Las regletas <b>${o.a} + ${o.b}</b> llegaron al suelo. No pasa nada: puedes volver a construir los muros de este nivel.</p><p>Has completado <b>${completed.size}</b> parejas.</p><button class="action" id="retry">↻ Repetir nivel ${level}</button><button class="action secondary" id="options">⚙ Cambiar dificultad</button>`;$('#retry').onclick=()=>begin(level);$('#options').onclick=intro}
function levelWon(){el.overlay.classList.remove('hidden');let medals=mistakes===0?3:mistakes<=2?2:1;let stars='⭐'.repeat(medals)+'☆'.repeat(3-medals);if(level<maxLevel){el.panel.innerHTML=`<div class="big">🏰🎉</div><h2>¡Castillo del nivel ${level} construido!</h2><div class="starsResult">${stars}</div><p><b>🏆 ${score} puntos</b> · ${mistakes} errores · Mejor racha: ¡${bestStreak}!</p><p>Has construido todos los muros <b>del 2 al ${level+1}</b> sin dejar caer ninguna pareja. En el siguiente nivel se incorpora el <b>muro del ${level+2}</b>.</p><button class="action" id="next">➡ Nivel ${level+1}</button><button class="action secondary" id="repeat">↻ Repetir</button>`;$('#next').onclick=()=>begin(level+1);$('#repeat').onclick=()=>begin(level)}else{el.panel.innerHTML=`<div class="big">🏅🏰🎉</div><h2>¡Campeón de los castillos!</h2><div class="starsResult">${stars}</div><p>🏆 ${score} puntos</p><p>¡Has completado los muros del <b>2 al 10</b> y todas sus descomposiciones con dos regletas!</p><button class="action" id="again">🎈 Volver al nivel 1</button>`;$('#again').onclick=()=>begin(1)}}
function pause(){if(!playing)return;paused=!paused;$('#pause').textContent=paused?'▶ Continuar':'⏸ Pausa';if(paused){cancelAnimationFrame(frameId);el.overlay.classList.remove('hidden');el.panel.innerHTML=`<div class="big">⏸️</div><h2>Juego en pausa</h2><p>Continúa cuando quieras.</p><button class="action" id="resume">▶ Continuar</button>`;$('#resume').onclick=pause}else{el.overlay.classList.add('hidden');lastFrame=0;frameId=requestAnimationFrame(tick)}}
$('#pause').onclick=pause;$('#restart').onclick=()=>intro();$('#mute').textContent=musicOn?'🔊':'🔇';$('#mute').onclick=()=>{musicOn=!musicOn;$('#mute').textContent=musicOn?'🔊':'🔇';saveSettings();if(musicOn)audioStart();else if(musicTimer){clearInterval(musicTimer);musicTimer=null}};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&playing)pause()});window.addEventListener('blur',()=>{if(playing&&!paused)pause()});intro();
</script>
</body></html>
