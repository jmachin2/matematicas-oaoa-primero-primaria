<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor visual OAOA</title>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+ES:wght@100..400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#17384e;background:#eaf3f7}
header{position:sticky;top:0;z-index:5;background:white;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:2px solid #bdd5e2}
button,select,input,textarea{font:inherit;border:1px solid #aac4d2;border-radius:7px;padding:7px;background:white}button{cursor:pointer}button.primary{background:#357fa5;color:white}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:12px;padding:12px}
aside{background:white;padding:13px;border-radius:10px;display:grid;gap:10px;align-content:start;position:sticky;top:70px}
aside label{display:grid;gap:4px;font-weight:bold;font-size:12px}aside input,aside textarea,aside select{width:100%}aside textarea{min-height:68px}
.paper-area{display:grid;justify-content:center;gap:18px}.paper{width:210mm;height:297mm;position:relative;background:white;box-shadow:0 4px 18px #2345;overflow:hidden}.paper.landscape{width:297mm;height:210mm}
.block{position:absolute;border:1px dashed transparent;resize:both;overflow:auto;min-width:15mm;min-height:7mm;padding:2mm;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.block.school{font-family:"Playwrite ES",cursive}.block.math{font-family:Arial,sans-serif}
.block.selected{border:2px solid #378abc;background:#e6f7ff55}
.block .text{outline:0;min-height:1em}.block .drag{position:absolute;right:0;top:0;background:#378abc;color:white;font:11px Arial;padding:3px;display:none;touch-action:none;cursor:grab}
.block.selected .drag{display:block}.block.warning{outline:3px solid #d55}
#status{font-size:12px;padding:9px;background:#e7f3f8;border-radius:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}
@media(max-width:900px){.layout{display:block}aside{position:static;margin-bottom:12px}.paper-area{justify-content:start;overflow:auto}}
@page{size:A4 portrait;margin:0}
@media print{header,aside{display:none!important}body{background:white}.layout{display:block;padding:0}.paper-area{display:block}.paper{box-shadow:none;break-after:page}.paper:last-child{break-after:auto}.block{border:0!important;outline:0!important;background:none!important;resize:none;overflow:visible}.drag{display:none!important}}

/* Objetos matemáticos editables: conservan valores, formas y código de colores de las regletas. */
.block.rod{border:2px solid #708694;border-radius:5px;text-align:center;line-height:1.1;padding:1mm;font-family:Arial,sans-serif;font-weight:bold}
.block.rod .text{font-size:inherit;font-weight:700}
.block.diagram{border:2px solid #718b78;border-radius:7px;text-align:center;background:#fbfff9;font-family:Arial,sans-serif;font-weight:bold;line-height:1.25}
.block.connector{font:20px Arial,sans-serif;text-align:center;line-height:1.1;overflow:hidden;resize:both;padding:0}
.block.answer{border:1px dashed #819aa9;border-radius:6px;background:#fff;font-family:Arial,sans-serif}
.block.drawing{border:2px dotted #b8c9d2;border-radius:8px;background:#fbfdff;font-family:Arial,sans-serif}
.block.math{font-weight:700}
@media print{.block.rod{border:2px solid #708694!important}.block.diagram{border:2px solid #718b78!important}.block.answer{border:1px dashed #819aa9!important}.block.drawing{border:2px dotted #b8c9d2!important}}
</style><style id="orientationCss"></style></head><body>
<header><strong>Editor de exámenes OAOA</strong><a href="../examenes/">← Generador</a><select id="orientation"><option value="portrait">A4 vertical</option><option value="landscape">A4 apaisado</option></select><button id="pageAdd">+ Página</button><button id="save">Guardar diseño</button><button id="load">Recuperar</button><button class="primary" id="print">Imprimir / Guardar PDF</button></header>
<div class="layout"><aside><strong>Editar elemento</strong><small>Selecciona un texto. Puedes escribir sobre él y arrastrarlo con el control MOVER. Cambia el tamaño del recuadro desde su esquina inferior derecha.</small>
<label>Texto<textarea id="text"></textarea></label>
<label>Tamaño (px)<input type="number" id="size" value="25" min="10" max="90"></label>
<label>Color de texto<input type="color" id="color" value="#17384e"></label><label>Fondo / color de regleta<input type="color" id="fill" value="#ffffff"></label>
<label>Tipo de letra<select id="font"><option value="school">Playwrite ES</option><option value="math">Arial</option></select></label>
<label>X (mm)<input type="number" id="x" step="1"></label><label>Y (mm)<input type="number" id="y" step="1"></label>
<label>Anchura (mm)<input type="number" id="width" step="1"></label><label>Altura (mm)<input type="number" id="height" step="1"></label>
<div class="buttons"><button id="newText">+ Texto</button><button id="newBox">+ Respuesta</button><button id="duplicate">Duplicar</button><button id="delete">Eliminar</button><button id="newRod">+ Regleta</button><button id="newDiagram">+ Parte-todo</button></div>
<div id="status">Selecciona un bloque.</div>
<small>Editor opcional. El generador original y su descarga PDF permanecen disponibles.</small></aside>
<main class="paper-area" id="area"></main></div>
<script>
(()=>{
"use strict";
const find=id=>document.getElementById(id);
const area=find("area");
let selected=null;
const dims=()=>find("orientation").value==="landscape"?[297,210]:[210,297];
const num=style=>parseFloat(style)||0;
function page(){const e=document.createElement("div");e.className="paper";e.classList.toggle("landscape",find("orientation").value==="landscape");area.append(e);return e}
function make(p,m){
 const e=document.createElement("div");e.className="block "+(m.kind||"school");
 e.style.left=(m.x||0)+"mm";e.style.top=(m.y||0)+"mm";e.style.width=(m.w||170)+"mm";e.style.height=(m.h||16)+"mm";e.style.fontSize=(m.size||25)+"px";e.style.color=m.color||"#17384e";if(m.fill)e.style.backgroundColor=m.fill;
 const t=document.createElement("div");t.className="text";t.contentEditable="true";t.textContent=m.text||"";
 const drag=document.createElement("span");drag.className="drag";drag.textContent="MOVER";
 e.append(t,drag);p.append(e);
 e.addEventListener("click",()=>choose(e));t.addEventListener("focus",()=>choose(e));
 t.addEventListener("input",()=>{if(e===selected)find("text").value=t.textContent;validate()});
 drag.addEventListener("pointerdown",event=>{
   event.preventDefault();event.stopPropagation();choose(e);drag.setPointerCapture(event.pointerId);
   const rect=p.getBoundingClientRect(),scale=dims()[0]/rect.width;
   const x=num(e.style.left),y=num(e.style.top),sx=event.clientX,sy=event.clientY;
   function moving(ev){e.style.left=Math.max(0,x+(ev.clientX-sx)*scale)+"mm";e.style.top=Math.max(0,y+(ev.clientY-sy)*scale)+"mm";sync();validate()}
   drag.addEventListener("pointermove",moving);
   drag.addEventListener("pointerup",()=>drag.removeEventListener("pointermove",moving),{once:true});
 });
 e.addEventListener("mouseup",()=>{if(e===selected)sync();validate()});
 return e;
}
function choose(e){if(selected)selected.classList.remove("selected");selected=e;e.classList.add("selected");sync()}
function sync(){if(!selected)return;find("text").value=selected.querySelector(".text").textContent;find("size").value=num(selected.style.fontSize);find("color").value=selected.style.color.startsWith("#")?selected.style.color:"#17384e";find("font").value=selected.classList.contains("math")?"math":"school";find("x").value=num(selected.style.left);find("y").value=num(selected.style.top);find("width").value=num(selected.style.width);find("height").value=num(selected.style.height);find("fill").value=colorHex(selected.style.backgroundColor)}
function colorHex(c){if(!c)return "#ffffff";if(c.startsWith("#"))return c;const nums=(c.match(/\d+/g)||[]).slice(0,3);return nums.length===3?"#"+nums.map(n=>Number(n).toString(16).padStart(2,"0")).join(""):"#ffffff"}
function currentPage(){return selected?selected.closest(".paper"):area.querySelector(".paper")}
function changed(){const map={size:["fontSize","px"],x:["left","mm"],y:["top","mm"],width:["width","mm"],height:["height","mm"]};for(const key of Object.keys(map)){find(key).addEventListener("input",()=>{if(!selected)return;selected.style[map[key][0]]=find(key).value+map[key][1];validate()})}}
changed();
find("text").addEventListener("input",()=>{if(selected){selected.querySelector(".text").textContent=find("text").value;validate()}});
find("color").addEventListener("input",()=>{if(selected)selected.style.color=find("color").value});
find("fill").addEventListener("input",()=>{if(selected)selected.style.backgroundColor=find("fill").value});
find("font").addEventListener("change",()=>{if(selected){selected.classList.remove("school","math");selected.classList.add(find("font").value)}});
find("orientation").addEventListener("change",()=>{const landscape=find("orientation").value==="landscape";area.querySelectorAll(".paper").forEach(p=>p.classList.toggle("landscape",landscape));find("orientationCss").textContent="@page{size:A4 "+find("orientation").value+";margin:0}";validate()});
find("pageAdd").onclick=()=>{page();validate()};
find("newText").onclick=()=>{choose(make(currentPage()||page(),{text:"Escribe el texto aquí",x:15,y:25,w:160,h:20,size:26}));validate()};
find("newBox").onclick=()=>{choose(make(currentPage()||page(),{text:"Respuesta: __________________",kind:"math",x:15,y:75,w:160,h:35,size:22}));validate()};
const rodColors={1:"#f5f1e8",2:"#d95757",3:"#9acb6a",4:"#f29ac2",5:"#edda4a",6:"#2d7b4d",7:"#202020",8:"#8b654e",9:"#247cb0",10:"#ef8d32"};
find("newRod").onclick=()=>{const el=make(currentPage()||page(),{kind:"rod",text:"2",x:18,y:100,w:29,h:11,size:25,color:"#fff",fill:rodColors[2]});choose(el);validate()};
find("newDiagram").onclick=()=>{const p=currentPage()||page();const y=115;const first=make(p,{kind:"diagram",text:"8",x:93,y,w:23,h:13,size:26});make(p,{kind:"connector",text:"╱       ╲",x:79,y:y+12,w:53,h:12,size:28});make(p,{kind:"diagram",text:"5",x:70,y:y+23,w:25,h:13,size:26});make(p,{kind:"diagram",text:"?",x:112,y:y+23,w:25,h:13,size:26});choose(first);validate()};
find("delete").onclick=()=>{if(selected){selected.remove();selected=null;validate()}};
find("duplicate").onclick=()=>{if(!selected)return;const e=selected;const p=e.closest(".paper");choose(make(p,{text:e.querySelector(".text").textContent,kind:e.classList.contains("math")?"math":"school",x:num(e.style.left)+5,y:num(e.style.top)+5,w:num(e.style.width),h:num(e.style.height),size:num(e.style.fontSize),color:e.style.color,fill:e.style.backgroundColor}));validate()};
function validate(){let errors=0;const [W,H]=dims();area.querySelectorAll(".block").forEach(e=>{const p=e.closest(".paper"),pr=p.getBoundingClientRect(),r=e.getBoundingClientRect(),bad=num(e.style.left)<0||num(e.style.top)<0||num(e.style.left)+r.width/pr.width*W>W-2||num(e.style.top)+r.height/pr.height*H>H-2||e.scrollHeight>e.clientHeight+3;e.classList.toggle("warning",bad);if(bad)errors++});find("status").textContent=errors?errors+" elementos se salen del recuadro o del A4. Corrígelos antes de imprimir.":"Bloques dentro de la hoja. Revisa visualmente el contenido.";find("print").disabled=errors>0;return !errors}
function serialize(){return {orientation:find("orientation").value,pages:Array.from(area.children,p=>Array.from(p.querySelectorAll(".block"),e=>({text:e.querySelector(".text").textContent,kind:e.classList.contains("math")?"math":"school",x:num(e.style.left),y:num(e.style.top),w:num(e.style.width),h:num(e.style.height),size:num(e.style.fontSize),color:e.style.color,fill:e.style.backgroundColor})))}}
find("save").onclick=()=>{localStorage.setItem("oaoa-exam-layout-v1",JSON.stringify(serialize()));find("status").textContent="Diseño guardado en este navegador."};
find("load").onclick=()=>{try{const model=JSON.parse(localStorage.getItem("oaoa-exam-layout-v1"));if(!model)return;area.replaceChildren();find("orientation").value=model.orientation;model.pages.forEach(items=>{const p=page();items.forEach(m=>make(p,m))});find("orientation").dispatchEvent(new Event("change"))}catch(e){find("status").textContent="No se pudo cargar el diseño."}};
find("print").onclick=async()=>{if(document.fonts)await document.fonts.ready;if(validate()){if(selected)selected.classList.remove("selected");window.print()}};
function add(p,kind,text,x,y,w,h,size=21,color="#17384e",fill=null){return make(p,{kind,text,x,y,w,h,size,color,fill})}
function math(p,text,x,y,w=33,h=10,size=23){return add(p,"math",text,x,y,w,h,size)}
function label(p,text,x,y,w=42,h=9,size=17){return add(p,"school",text,x,y,w,h,size)}
function diagram(p,total,known,y,x=80){
 const root=add(p,"diagram",String(total),x+26,y,24,12,25);
 add(p,"connector","╱          ╲",x+9,y+11,58,11,21);
 add(p,"diagram",String(known),x,y+22,25,13,25);
 add(p,"diagram","?",x+51,y+22,25,13,25);
 return root;
}
function rod(p,n,x,y,scale=1){
 const v=Number(n),value=Number.isFinite(v)?v:2;
 const width=Math.min(47,Math.max(12,5+value*4))*scale;
 return add(p,"rod",String(value),x,y,width,11,21,[2,6,7,8,9].includes(value)?"#fff":"#17384e",rodColors[value]||"#eee");
}
function answer(p,text,x,y,w=72,h=14){return add(p,"answer",text,x,y,w,h,18)}
function drawing(p,x,y,w=67,h=27){return add(p,"drawing","Dibujo / regletas",x,y,w,h,17)}
function examTask(p,t,i){
 const y=49+i*78, type=t.type||"problem";
 label(p,(i+1)+". "+(t.title||"Actividad"),14,y,181,17,29);
 label(p,t.instruction||"Resuelve y explica tu respuesta.",15,y+17,181,22,23);
 const by=y+42;
 // Reutilizar los datos matemáticos originales; cada pieza se puede seleccionar y mover por separado.
 if(type==="complement9"){
  (t.parts||[2,5,7]).forEach((v,k)=>{const x=17+k*63;rod(p,9,x,by);math(p,"9 = "+v+" + □",x,by+17,60,12,21)});
 }else if(type==="represent9"){
  diagram(p,9,t.known||4,by,18);
  drawing(p,103,by,84,29);
  label(p,"Dibuja nueve elementos y escribe la suma.",99,by+29,94,10,15);
 }else if(type==="pairs789"){
  (t.targets||[7,8,9]).forEach((v,k)=>{const x=16+k*62;rod(p,v,x,by);math(p,v+" = "+(t.parts||[3,5,4])[k]+" + □",x,by+18,61,12,21)});
 }else if(type==="previous"){
  (t.numbers||[9,7,5,3]).forEach((v,k)=>{const x=16+(k%2)*92,y=by+Math.floor(k/2)*19;rod(p,v,x,y);math(p,v+" − 1 = □",x+37,y,52,13,21)});
 }else if(type==="sum789"){
  (t.sums||["5 + 2","6 + 2","4 + 5","3 + 6"]).forEach((v,k)=>math(p,v+" = □",16+(k%2)*91,by+Math.floor(k/2)*18,84,14,24));
 }else if(type==="twoWays"){
  label(p,"Objetivo",18,by,35,10);rod(p,t.target||4,57,by);
  drawing(p,18,by+12,72,18);drawing(p,101,by+12,72,18);
 }else if(type==="missingPairs"||type==="pairs8"||type==="pairs678"||type==="pairs567"||type==="seven"){
  const vals=type==="missingPairs"?(t.parts||[1,2,3]).map(v=>[t.target||5,v]):
   type==="pairs8"?[[8,1],[8,2],[8,3],[8,4]]:
   type==="pairs678"?[[6,2],[7,3],[8,5],[8,4]]:
   type==="seven"?[[7,1],[7,2],[7,3]]:[[5,4],[6,2],[7,3],[7,5]];
  vals.slice(0,4).forEach((pair,k)=>{
   const x=18+(k%2)*91, yy=by+Math.floor(k/2)*16;
   math(p,pair[0]+" =",x,yy,22,12);rod(p,pair[1],x+26,yy);math(p,"+ □",x+59,yy,30,12)
  });
 }else if(type==="partWhole"||type==="tree7"||type==="represent8"||type==="p26"){
  diagram(p,t.total|| (type==="tree7"?7:8),t.known|| (type==="represent8"?3:2),by-2,20);
  if(type==="p26"){diagram(p,7,2,by-2,110)}
  else{answer(p,"Suma: _________",113,by+4,77,13);answer(p,"Explico: _________",113,by+20,77,12)}
 }else if(type==="complements"){
  (t.targets||[[4,2],[3,1],[4,1]]).slice(0,3).forEach(([target,known],k)=>{
   const x=17+k*61;rod(p,target,x,by+3);rod(p,known,x,by+19);
   math(p,"+ □",x+27,by+19,33,13);
  });
 }else if(type==="commute"){
  math(p,(t.a||2)+" + "+(t.b||3),18,by+2,58,13,25);
  math(p,(t.b||3)+" + "+(t.a||2),110,by+2,58,13,25);
  rod(p,t.a||2,23,by+18);rod(p,t.b||3,50,by+18);
  rod(p,t.b||3,115,by+18);rod(p,t.a||2,149,by+18);
 }else if(type==="problem"||type==="p25"||type==="money7"||type==="p27"){
  drawing(p,17,by,69,29);
  answer(p,"OPERACIÓN: __________",99,by,94,13);
  answer(p,"RESPUESTA: __________",99,by+16,94,13);
 }else if(type==="classify"||type==="p28"||type==="sum567"){
  const items=type==="classify"?(t.items||["1 + 3","2 + 3","2 + 2","4 + 1"]):
   type==="p28"?["5 + 3","6 + 0","4 + 4","6 + 1"]:["4 + 1","3 + 3","5 + 2","2 + 3"];
  items.slice(0,4).forEach((v,k)=>math(p,v,17+(k%2)*92,by+Math.floor(k/2)*17,76,14,24));
 }else if(type==="matchSums"){
  (t.pairs||[["2 + 1",3],["1 + 3",4],["3 + 2",5]]).slice(0,3).forEach((pair,k)=>{
   math(p,pair[0],18,by+k*12,55,11,22);math(p,String(pair[1]),130,by+k*12,35,11,22)
  })
 }else if(type==="successor"){
  [2,3,4,5,6].forEach((v,k)=>{math(p,v+" + 1 =",16+(k%3)*62,by+Math.floor(k/3)*16,43,12,21);answer(p,"□",56+(k%3)*62,by+Math.floor(k/3)*16,18,12)})
 }else if(type==="six"||type==="detective"||type==="p27"||type==="p28"){
  const sums=type==="six"?["3+3","4+2","2+3","1+5"]:type==="detective"?["2+3=5","3+3=6","2+3=6"]:["5+3","6+0","4+4","3+5"];
  sums.forEach((v,k)=>math(p,v,18+(k%2)*90,by+Math.floor(k/2)*17,73,13,22));
 }else{
  drawing(p,17,by,80,30);answer(p,"CÁLCULO: __________",103,by+2,90,13);answer(p,"Respuesta: _________",103,by+18,90,13);
 }
}
function start(){
 let raw;try{raw=JSON.parse(sessionStorage.getItem("oaoa-exam-for-editor")||"null")}catch(e){}
 if(raw&&Array.isArray(raw.sessions)&&raw.sessions.length){
  raw.sessions.slice(0,2).forEach((session,index)=>{
   const p=page();
   label(p,"PRUEBA DE MATEMÁTICAS",14,9,181,18,30);
   math(p,"Nombre: __________________     Fecha: __________",15,28,183,12,19);
   (session.tasks||[]).slice(0,3).forEach((t,i)=>examTask(p,t,i));
  });
  find("status").textContent="Ejercicios originales importados con regletas, operaciones, diagramas y zonas de respuesta editables.";
 }else{
  const p=page();label(p,"PRUEBA DE MATEMÁTICAS",14,12,181,20,31);
  math(p,"Nombre: __________________     Fecha: __________",15,37,181,13,20);
  label(p,"Abre el editor desde el generador para importar ejercicios reales.",15,62,181,28,22);
 }
 validate();
}

start();if(document.fonts)document.fonts.ready.then(validate);
})();
</script></body></html>
